{% extends 'base.html' %}{% block content %}<section class="hero"><div><p class="eyebrow">software commerciale premium</p><h1>Crea prodotti digitali pronti per la vendita.</h1><p>PDF, copertina, mockup, SEO, README e ZIP finale generati realmente in un solo flusso.</p></div><div class="stats"><b>{{stats.count}}</b><span>prodotti creati</span><b>{{stats.space}} KB</b><span>spazio usato</span></div></section><form method="post" class="panel grid"><label>Nome prodotto<input name="name" required value="Luxury Productivity Planner"></label><label>Nicchia<input name="niche" required value="Productivity"></label><label>Lingua<select name="language"><option>Italiano</option><option>English</option><option>Español</option></select></label><label>Formato<select name="format"><option>A4 PDF</option><option>US Letter PDF</option></select></label><label>Numero pagine<input type="number" min="1" max="240" name="pages" value="24"></label><label>Colore principale<input type="color" name="primary_color" value="#0b0b0d"></label><label>Colore secondario<input type="color" name="secondary_color" value="#d4af37"></label><label>Font<select name="font">{% for f in fonts %}<option>{{f}}</option>{% endfor %}</select></label><label>Stile<select name="style">{% for s in styles %}<option>{{s}}</option>{% endfor %}</select></label><label>Marketplace<select name="marketplace">{% for m in marketplaces %}<option>{{m}}</option>{% endfor %}</select></label><label>Categoria<select name="category" id="category">{% for c in products %}<option>{{c}}</option>{% endfor %}</select></label><label>Tipo prodotto<select name="product_type" id="product_type"></select></label><button class="gold" type="submit">GENERA</button></form>{% endblock %}
